<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Agent Harness</title>
<style>
  :root {
    --bg: #0b0b0c; --panel: #111113; --panel2: #16161a; --line: #222228; --line2: #2c2c34;
    --text: #e9e7e4; --dim: #8a8a93; --faint: #55555e;
    --accent: #cd5019; --accent2: #ff6826; --ok: #4cc38a; --bad: #e5534b; --warn: #e2b340; --info: #5aa2ff;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, .lbl, .chip, .tabs button, table, .meta { font-family: var(--mono); }
  .lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
  .lbl b { color: var(--text); font-weight: 600; }
  .strip { display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line);
           font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim);
           position: sticky; top: 0; background: rgba(11,11,12,.92); backdrop-filter: blur(6px); z-index: 10;
           overflow-x: auto; white-space: nowrap; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--faint); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.run { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); } .dot.warn { background: var(--warn); }
  .strip .sp { margin-left: auto; }
  .grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 400px; min-height: calc(100vh - 41px); }
  .col { padding: 18px; border-right: 1px solid var(--line); min-width: 0; }
  .col:last-child { border-right: none; }
  @media (max-width: 1150px) {
    .grid { grid-template-columns: 1fr; }
    .col { border-right: none; border-bottom: 1px solid var(--line); }
    .needs { order: -2; } .centre { order: -1; }
  }
  h2.sec { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font: 600 13px var(--mono);
           letter-spacing: 2.5px; text-transform: uppercase; }
  h2.sec .ico { color: var(--accent2); }
  h2.sec .r { margin-left: auto; color: var(--faint); font-weight: 400; font-size: 11px; letter-spacing: 1px; }
  section + section { margin-top: 26px; }
  .clock { display: flex; align-items: baseline; gap: 6px; }
  .clock .hm { font: 600 46px var(--mono); color: var(--accent2); letter-spacing: 1px; }
  .clock .s { font: 500 18px var(--mono); color: var(--dim); }
  .meter { margin: 10px 0; }
  .meter .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .meter .bar i { display: block; height: 100%; background: var(--accent); }
  .meter .bar i.ok { background: var(--ok); } .meter .bar i.warn { background: var(--warn); } .meter .bar i.bad { background: var(--bad); }
  .lockrow { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .lockrow .n { font-family: var(--mono); color: var(--dim); width: 58px; flex: none; text-transform: uppercase; font-size: 11px; padding-top: 2px; }
  .lockrow .w { min-width: 0; }
  .lockrow .t { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .lockrow .t.stale { color: var(--warn); }
  .tree { font-size: 12px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .tree .b { font-family: var(--mono); color: var(--text); word-break: break-all; }
  .tree .s { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { text-align: center; margin: 4px 0 14px; }
  .title .big { font: 700 26px var(--mono); letter-spacing: 5px; }
  .title .big span { color: var(--accent2); font-weight: 500; letter-spacing: 1px; font-family: system-ui, sans-serif; }
  .title .sub { font: 11px var(--mono); letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .tabs button { background: var(--panel); border: 1px solid var(--line2); color: var(--dim); border-radius: 6px;
                 padding: 7px 14px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  .chip { font-size: 11px; border: 1px solid var(--line2); border-radius: 5px; padding: 3px 8px; color: var(--dim); background: var(--panel); }
  .chip i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; }
  #orbit { width: 100%; max-width: 560px; max-height: 62vh; aspect-ratio: 1; display: block; margin: 0 auto; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--faint); font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase; font-size: 10px; }
  .st { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
  .st.working, .st.ok { color: var(--ok); } .st.blocked, .st.fail { color: var(--bad); }
  .st.waiting, .st.run { color: var(--accent2); } .st.idle { color: var(--faint); }
  .needcount { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .needcount .n { font: 700 54px var(--mono); color: var(--accent2); line-height: 1; }
  .needcount .n.zero { color: var(--ok); }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px;
          padding: 12px; margin: 10px 0; }
  .card.urgent { box-shadow: inset 0 0 0 1px var(--bad); }
  .card .who { display: flex; gap: 8px; align-items: center; font: 11px var(--mono); color: var(--dim); }
  .card .who b { color: var(--text); font-weight: 600; font-family: system-ui, sans-serif; font-size: 14px; }
  .card .who .age { margin-left: auto; color: var(--faint); }
  .card h3 { margin: 6px 0; font-size: 15px; font-weight: 600; }
  .card .body { white-space: pre-wrap; color: #cfcdca; margin: 6px 0; }
  .media { display: grid; gap: 8px; margin: 8px 0; }
  .media video, .media img { width: 100%; border-radius: 5px; background: #000; border: 1px solid var(--line); }
  .media .cap { color: var(--faint); font: 11px var(--mono); word-break: break-all; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .opts button { flex: 1 1 110px; min-height: 46px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel2);
                 color: var(--text); font: 600 14px system-ui, sans-serif; cursor: pointer; }
  .opts button.rec { box-shadow: inset 0 0 0 1px var(--accent2); }
  .opts button.yes { background: #12291e; border-color: #1f5a3c; } .opts button.no { background: #2c1514; border-color: #6a2a27; }
  .opts button:active { transform: scale(.98); }
  .linkbtn { background: none; border: none; color: var(--faint); font: 12px var(--mono); padding: 6px 0 0; cursor: pointer; }
  .note { width: 100%; margin-top: 8px; min-height: 56px; background: var(--bg); color: var(--text); border: 1px solid var(--line2);
          border-radius: 6px; padding: 8px; font: inherit; display: none; }
  .ev { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line);
        font-size: 12px; align-items: baseline; }
  .ev .tm { font: 11px var(--mono); color: var(--faint); }
  .ev .tx { min-width: 0; overflow-wrap: anywhere; }
  .ev .tx b { font-weight: 600; font-family: var(--mono); font-size: 11px; }
  .empty { color: var(--faint); font: 12px var(--mono); padding: 18px 0; text-align: center; letter-spacing: 1px; }
  .answer { color: var(--ok); font-weight: 600; }
  .acard { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 9px 11px; margin: 8px 0; cursor: pointer; }
  .acard:hover { border-color: var(--line2); background: var(--panel2); }
  .acard .d { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .acard .nm { font: 600 13px var(--mono); letter-spacing: .5px; }
  .acard .sub { font: 11px var(--mono); color: var(--faint); }
  .acard .rt { margin-left: auto; text-align: right; }
  .acard.off { opacity: .45; }
  .acard .tgl { background: none; border: 1px solid var(--line2); color: var(--dim); border-radius: 5px; font: 10px var(--mono); padding: 2px 6px; cursor: pointer; margin-top: 3px; }
</style>
</head>
<body>
<div class="strip">
  <span><i class="dot" id="dHarness"></i>harness</span>
  <span><i class="dot" id="dGpu"></i><span id="tGpu">gpu</span></span>
  <span><i class="dot" id="dBuild"></i><span id="tBuild">build</span></span>
  <span><i class="dot" id="dGate"></i><span id="tGate">gate</span></span>
  <span class="sp" id="tSync">sync —</span>
</div>
<div class="grid">
  <div class="col">
    <section>
      <h2 class="sec"><span class="ico">◷</span>Today<span class="r" id="tDate"></span></h2>
      <div class="clock"><span class="hm" id="cHM">--:--</span><span class="s" id="cS">:--</span></div>
      <div class="lbl" id="cSub">local</div>
    </section>
    <section><h2 class="sec"><span class="ico">▣</span>Machine</h2><div id="machine"></div></section>
    <section><h2 class="sec"><span class="ico">◔</span>Claude quota<span class="r" id="tQuota"></span></h2><div id="quota"></div></section>
    <section><h2 class="sec"><span class="ico">⛓</span>Locks</h2><div id="locks"></div></section>
    <section><h2 class="sec"><span class="ico">⑂</span>Worktrees<span class="r" id="nTrees"></span></h2><div id="trees"></div></section>
  </div>
  <div class="col centre">
    <div class="title"><div class="big"><b id="cfgName">AGENT HARNESS</b> <span>Agents</span></div><div class="sub" id="cfgSub">Command Centre</div></div>
    <div class="tabs" id="tabs">
      <button data-v="orbit" class="on">Orbit</button><button data-v="board">Board</button>
      <button data-v="builds">Queue</button><button data-v="timeline">Timeline</button><button data-v="history">Answered</button>
    </div>
    <div class="chips" id="legend"></div>
    <div id="centre"></div>
  </div>
  <div class="col needs">
    <section>
      <h2 class="sec"><span class="ico">✉</span>Needs <b id="cfgOwner">you</b><span class="r"><button class="linkbtn" id="sndBtn" title="Chime when a new decision arrives">🔔 sound</button></span></h2>
      <div class="needcount"><div class="n" id="nNeed">0</div><div class="lbl" id="nNeedSub">open<br>decisions</div></div>
      <div id="inbox"></div>
    </section>
    <section><h2 class="sec"><span class="ico">⚡</span>Activity<span class="r" id="nEv"></span></h2><div id="activity"></div></section>
    <section><h2 class="sec"><span class="ico">◉</span>Agents<span class="r"><button class="linkbtn" id="addAgentBtn">+ add agent</button></span></h2>
      <div id="addAgent" class="card" style="display:none">
        <div class="lbl">New agent</div>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <input id="naName" placeholder="Name (letters, digits)" style="flex:1 1 140px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:8px">
          <input id="naColor" type="color" value="#5aa2ff" style="width:46px;height:38px;background:none;border:1px solid var(--line2);border-radius:6px">
          <input id="naCwd" value="" style="flex:1 1 200px;background:var(--bg);color:var(--text);border:1px solid var(--line2);border-radius:6px;padding:8px;font:12px var(--mono)">
        </div>
        <div class="opts"><button class="yes" id="naCreate">Create and open</button><button id="naCancel">Cancel</button></div>
      </div>
      <div id="agents"></div></section>
  </div>
</div>
<script>
"use strict";
// Agent names, colours and labels come from the server: the agent registry plus harness.config.json.
let CFG = {}, COORD = "Reviewer", AGENTS = [], COLOR = {}, SHORT = {};
const short = n => SHORT[n] || (String(n).match(/[A-Z0-9]/g) || [String(n)[0] || "?"]).join("").slice(0, 4).toUpperCase();
function applyConfig() {
  CFG = S.config || {}; COORD = CFG.coordinator || "Reviewer";
  const cards = S.agentCards || [];
  AGENTS = [COORD, ...cards.map(a => a.name).filter(n => n !== COORD)];
  COLOR = Object.assign({ Owner: "#ffffff", NightMode: "#55555e" }, CFG.agentColors || {});
  for (const a of cards) if (a.color) COLOR[a.name] = a.color;
  if (!COLOR[COORD]) COLOR[COORD] = "#ff6826";
  SHORT = Object.assign({ Owner: "YOU" }, CFG.agentShort || {});
  $("#cfgName").textContent = (CFG.projectName || "Agent Harness").toUpperCase();
  $("#cfgSub").textContent = CFG.subtitle || "";
  $("#cfgOwner").textContent = CFG.ownerName || "you";
  if (!$("#naCwd").value) $("#naCwd").value = CFG.defaultCwd || "";
}
const col = n => COLOR[n] || "#8a8a93";
// The real owner behind a lock: harness jobs hold it as "H<job>-<Agent>", harness builds as "Harness:<Agent>".
const owner = h => String(h || "").replace(/^H\d+-/, "").replace(/^Harness:/, "");
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono");
let S = null, view = "orbit", busy = false, lastIds = null, focusAgent = null, anim = 0, nodes = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const J = s => { try { return JSON.parse(s || "[]"); } catch { return []; } };
const ago = t => { if (!t) return ""; const m = Math.round((Date.now() / 1000 - t) / 60);
  return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
const hhmm = t => new Date(t * 1000).toTimeString().slice(0, 5);

function tick() {
  const d = new Date();
  $("#cHM").textContent = d.toTimeString().slice(0, 5);
  $("#cS").textContent = ":" + d.toTimeString().slice(6, 8);
  $("#tDate").textContent = d.toLocaleDateString(undefined, { weekday: "short", day: "2-digit", month: "short" });
  $("#cSub").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone || "local";
}
setInterval(tick, 1000); tick();

function meter(label, freeV, total, unit, lowWarn) {
  const used = total ? Math.max(0, Math.min(1, 1 - freeV / total)) : 0;
  const cls = freeV < lowWarn ? "bad" : used > .75 ? "warn" : "ok";
  return `<div class="meter"><div class="lbl">${label} <b>${freeV}</b> / ${total} ${unit} free</div>
          <div class="bar"><i class="${cls}" style="width:${(used * 100).toFixed(0)}%"></i></div></div>`;
}
function renderLeft() {
  const s = S.system || {};
  const procs = Object.entries(s.procs || {}).map(([k, v]) => `${esc(k.replace(".exe", ""))}×${v}`).join(" · ");
  $("#machine").innerHTML = meter("Disk D:", s.diskFreeGB ?? 0, 448, "GB", 10) + meter("RAM", s.ramFreeGB ?? 0, s.ramTotalGB ?? 0, "GB", 4)
    + meter("Commit", s.commitFreeGB ?? 0, s.commitTotalGB ?? 0, "GB", 8)
    + `<div class="lbl" style="margin-top:8px">${procs || "no editor · blender · build"}</div>`;
  const q = S.quota || {}, wins = q.windows || {}, names = { five_hour: "5-hour", seven_day: "Weekly", seven_day_opus: "Weekly Opus", seven_day_sonnet: "Weekly Sonnet" };
  const resets = t => { if (!t) return ""; const m = Math.max(0, Math.round((t - Date.now() / 1000) / 60));
    return m < 60 ? `resets in ${m} min` : m < 1440 ? `resets in ${Math.floor(m / 60)} h ${m % 60} min` : `resets ${new Date(t * 1000).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })}`; };
  $("#quota").innerHTML = Object.keys(wins).length ? Object.entries(wins).map(([k, w]) => {
      const u = Math.round((w.utilization || 0) * 100), cls = u >= 90 ? "bad" : u >= 70 ? "warn" : "ok";
      return `<div class="meter"><div class="lbl">${names[k] || k} <b>${u}%</b> used · ${resets(w.resetsAt)}</div><div class="bar"><i class="${cls}" style="width:${u}%"></i></div></div>`;
    }).join("") : `<div class="lbl">${q.error ? "quota probe failed: " + esc(q.error) : "waiting for the first reading"}</div>`;
  $("#tQuota").textContent = q.updated ? "read " + ago(q.updated) + " ago" : "";
  const locks = S.locks || [];
  $("#locks").innerHTML = ["gpu", "build.1", "build.2"].map(n => {
    const l = locks.find(x => x.lock === n);
    return `<div class="lockrow"><span class="n">${n}</span><div class="w">${l
      ? `<b style="color:${col(owner(l.holder))}">${esc(owner(l.holder))}</b>${l.holder !== owner(l.holder) ? ` <span class="st">via harness</span>` : ""}<div style="color:var(--dim)">${esc(l.what.split("|").slice(1, -1).join("|").trim())}</div>
         <div class="t ${l.minutes > 20 && l.holder !== "NightMode" ? "stale" : ""}">held ${l.minutes} min</div>`
      : `<span class="t">free</span>`}</div></div>`;
  }).join("");
  const trees = Array.isArray(S.worktrees) ? S.worktrees : [];
  $("#nTrees").textContent = trees.length;
  $("#trees").innerHTML = trees.map(t => `<div class="tree"><div class="b">${esc(t.branch || t.head)}
      ${t.ahead ? ` <span class="st run">+${t.ahead}</span>` : ""}${t.dirty ? ` <span class="st waiting">${t.dirty} dirty</span>` : ""}</div>
      <div class="s">${esc(t.path.split(/[\\/]/).pop())} · ${esc(t.age)} · ${esc(t.subject)}</div></div>`).join("");
  const gpu = locks.find(l => l.lock === "gpu");
  $("#dGpu").className = "dot " + (gpu ? (gpu.minutes > 20 ? "warn" : "run") : "ok");
  $("#tGpu").textContent = gpu ? `gpu · ${owner(gpu.holder)} · ${gpu.minutes} min` : "gpu · free";
  const builds = locks.filter(l => l.lock.startsWith("build") && l.holder !== "NightMode");
  $("#dBuild").className = "dot " + (builds.length ? "run" : "ok");
  $("#tBuild").textContent = builds.length ? `build · ${builds.map(b => owner(b.holder)).join(", ")}` : "build · idle";
  const gate = (S.events || []).find(e => e.kind === "gate");
  $("#dGate").className = "dot " + (gate ? ({ ok: "ok", fail: "bad", run: "run" }[gate.status] || "") : "");
  $("#tGate").textContent = gate ? `gate · ${gate.text.slice(0, 48)}` : "gate · —";
}

function agentState(name) {
  const a = (S.agents || []).find(x => x.name === name);
  const holds = (S.locks || []).filter(l => owner(l.holder) === name).map(l => l.lock);
  const asks = (S.inbox || []).filter(i => i.agent === name).length;
  return { a, holds, asks, state: a ? a.state : "", task: a ? a.task : "" };
}
function drawOrbit() {
  const c = $("#orbit"); if (!c || !S) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth;
  if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(w * dpr); }
  const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = w / 2, cy = w / 2, R = w * 0.36, t = performance.now() / 1000, small = w < 480;
  g.clearRect(0, 0, w, w);
  for (let k = 1; k <= 4; k++) {
    g.beginPath(); g.arc(cx, cy, R * k / 3.4, 0, Math.PI * 2);
    g.strokeStyle = k === 3 ? "#2c2c34" : "#1a1a1f"; g.lineWidth = 1; g.setLineDash(k % 2 ? [2, 6] : []); g.stroke();
  }
  g.setLineDash([]);
  for (let i = 0; i < 220; i++) {
    const a = i * 2.39996, r = R * 1.15 * Math.sqrt((i + .5) / 220);
    g.fillStyle = "rgba(120,120,135,.18)"; g.fillRect(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 1.2, 1.2);
  }
  const hubs = { gpu: [cx, cy - R * 0.5], "build.1": [cx - R * 0.45, cy + R * 0.3], "build.2": [cx + R * 0.45, cy + R * 0.3] };
  const others = AGENTS.filter(a => a !== COORD);
  nodes = others.map((name, i) => {
    const ang = -Math.PI / 2 + i * Math.PI * 2 / others.length;
    return { name, x: cx + Math.cos(ang) * R, y: cy + Math.sin(ang) * R, ang };
  });
  for (const n of nodes) {
    const st = agentState(n.name);
    for (const h of st.holds) if (hubs[h]) {
      const [hx, hy] = hubs[h];
      const grd = g.createLinearGradient(n.x, n.y, hx, hy);
      grd.addColorStop(0, col(n.name)); grd.addColorStop(1, "rgba(255,104,38,.15)");
      g.strokeStyle = grd; g.lineWidth = 2; g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(hx, hy); g.stroke();
      const p = (t * .6 + n.ang) % 1;
      g.fillStyle = "#fff"; g.beginPath(); g.arc(n.x + (hx - n.x) * p, n.y + (hy - n.y) * p, 2, 0, 7); g.fill();
    }
    if (st.asks) { g.strokeStyle = "rgba(255,104,38,.35)"; g.setLineDash([3, 5]); g.lineWidth = 1;
      g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(cx, cy); g.stroke(); g.setLineDash([]); }
  }
  g.textAlign = "center"; g.textBaseline = "middle";

// ---- new-decision chime (Web Audio, no asset). Browsers keep audio muted until the page has had a

let audioCtx = null, seenInbox = null;

function unlockAudio() {

function chime() {
